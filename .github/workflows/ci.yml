name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -buildvcs=false

jobs:
  workflow-policy:
    if: github.event_name != 'pull_request' || github.head_ref == 'develop' || startsWith(github.head_ref, 'release/')
    name: Workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned actionlint
        run: scripts/ci/install-tools.sh "$RUNNER_TEMP/mesail-tools" actionlint
      - name: Check workflows
        run: scripts/ci/check-workflows.sh

  shared:
    if: github.event_name != 'pull_request' || github.head_ref == 'develop' || startsWith(github.head_ref, 'release/')
    name: Shared gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned ty, fylo, Go, TinyGo and binaryen
        run: scripts/ci/install-tools.sh "$RUNNER_TEMP/mesail-tools" ty fylo go tinygo binaryen
      - name: Run shared gates
        run: LOG_ROOT="$RUNNER_TEMP/logs" scripts/gates.sh --shared-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && !env.ACT
        with:
          name: gates-shared
          path: ${{ runner.temp }}/logs
          retention-days: 7

  list-apps:
    if: github.event_name != 'pull_request' || github.head_ref == 'develop' || startsWith(github.head_ref, 'release/')
    name: List apps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: apps
        run: scripts/ci/app-matrix.sh

  apps:
    if: github.event_name != 'pull_request' || github.head_ref == 'develop' || startsWith(github.head_ref, 'release/')
    name: App gates (${{ matrix.app }})
    needs: list-apps
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.list-apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned ty, fylo, Go, TinyGo, binaryen and Bun
        run: scripts/ci/install-tools.sh "$RUNNER_TEMP/mesail-tools" ty fylo go tinygo binaryen bun
      - name: Install Chromium for the responsive test
        if: matrix.app == 'web'
        run: bun x playwright@1.60.0 install --with-deps chromium-headless-shell
      - name: Run app gates
        env:
          APP: ${{ matrix.app }}
          MESAIL_FYLO_ROOT: ${{ runner.temp }}/fylo
          TAC_HANDLER_COMPILE_SECONDS: "300"
        run: LOG_ROOT="$RUNNER_TEMP/logs" scripts/gates.sh --app "$APP" --apps-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && !env.ACT
        with:
          name: gates-${{ matrix.app }}
          path: ${{ runner.temp }}/logs
          retention-days: 7

  required:
    if: always() && (github.event_name != 'pull_request' || github.head_ref == 'develop' || startsWith(github.head_ref, 'release/'))
    name: required
    needs: [workflow-policy, shared, list-apps, apps]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every blocking job
        env:
          RESULTS: ${{ needs.workflow-policy.result }} ${{ needs.shared.result }} ${{ needs.list-apps.result }} ${{ needs.apps.result }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            test "$result" = success
          done
