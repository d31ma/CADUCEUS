name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Phase 0 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          install_release() {
            local repo="$1" binary="$2" version="$3"
            local asset="${binary}-linux-x64"
            local base="https://github.com/d31ma/${repo}/releases/download/v${version}"
            local tmp
            tmp="$(mktemp -d)"
            curl -fsSL "${base}/${asset}" -o "${tmp}/${binary}"
            curl -fsSL "${base}/SHA256SUMS" -o "${tmp}/SHA256SUMS"
            local expected actual
            expected="$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print tolower($1) }' "${tmp}/SHA256SUMS")"
            actual="$(sha256sum "${tmp}/${binary}" | awk '{ print tolower($1) }')"
            test -n "$expected"
            test "$expected" = "$actual"
            sudo install -m 755 "${tmp}/${binary}" "/usr/local/bin/${binary}"
          }
          install_release Tachyon ty 26.36.01
          install_release Fylo fylo 26.33.02
          install_release Chex chex 26.32.02
          install_release TTID ttid 26.32.03
          install_sesame() {
            local version="26.33.02"
            local asset="sesame-linux-amd64"
            local base="https://github.com/d31ma/SESAME/releases/download/v${version}"
            local tmp
            tmp="$(mktemp -d)"
            curl -fsSL "${base}/${asset}" -o "${tmp}/sesame"
            curl -fsSL "${base}/SHA256SUMS" -o "${tmp}/SHA256SUMS"
            local expected actual
            expected="$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print tolower($1) }' "${tmp}/SHA256SUMS")"
            actual="$(sha256sum "${tmp}/sesame" | awk '{ print tolower($1) }')"
            test -n "$expected"
            test "$expected" = "$actual"
            sudo install -m 755 "${tmp}/sesame" /usr/local/bin/sesame
          }
          install_sesame
      - run: bun install --frozen-lockfile
      - run: bun run go:build
      - run: bun run verify:phase0

  e2e:
    name: Playwright E2E tests
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FYLO_TEST_BINARY: /usr/local/bin/fylo
      SESAME_TEST_BINARY: /usr/local/bin/sesame
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install Tachyon runtime
        shell: bash
        run: |
          set -euo pipefail
          version=26.36.01
          asset=ty-linux-x64
          base="https://github.com/d31ma/Tachyon/releases/download/v${version}"
          tmp="$(mktemp -d)"
          curl -fsSL "${base}/${asset}" -o "${tmp}/ty"
          curl -fsSL "${base}/SHA256SUMS" -o "${tmp}/SHA256SUMS"
          expected="$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print tolower($1) }' "${tmp}/SHA256SUMS")"
          actual="$(sha256sum "${tmp}/ty" | awk '{ print tolower($1) }')"
          test -n "$expected"
          test "$expected" = "$actual"
          sudo install -m 755 "${tmp}/ty" /usr/local/bin/ty
      - name: Install locked identity and persistence runtimes
        shell: bash
        run: |
          set -euo pipefail
          install_release() {
            local repo="$1" binary="$2" version="$3"
            local asset="${binary}-linux-x64"
            local base="https://github.com/d31ma/${repo}/releases/download/v${version}"
            local tmp
            tmp="$(mktemp -d)"
            curl -fsSL "${base}/${asset}" -o "${tmp}/${binary}"
            curl -fsSL "${base}/SHA256SUMS" -o "${tmp}/SHA256SUMS"
            local expected actual
            expected="$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print tolower($1) }' "${tmp}/SHA256SUMS")"
            actual="$(sha256sum "${tmp}/${binary}" | awk '{ print tolower($1) }')"
            test -n "$expected"
            test "$expected" = "$actual"
            sudo install -m 755 "${tmp}/${binary}" "/usr/local/bin/${binary}"
          }
          install_release Fylo fylo 26.33.02
          install_release Chex chex 26.32.02
          install_release TTID ttid 26.32.03
          install_sesame() {
            local version="26.33.02"
            local asset="sesame-linux-amd64"
            local base="https://github.com/d31ma/SESAME/releases/download/v${version}"
            local tmp
            tmp="$(mktemp -d)"
            curl -fsSL "${base}/${asset}" -o "${tmp}/sesame"
            curl -fsSL "${base}/SHA256SUMS" -o "${tmp}/SHA256SUMS"
            local expected actual
            expected="$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print tolower($1) }' "${tmp}/SHA256SUMS")"
            actual="$(sha256sum "${tmp}/sesame" | awk '{ print tolower($1) }')"
            test -n "$expected"
            test "$expected" = "$actual"
            sudo install -m 755 "${tmp}/sesame" /usr/local/bin/sesame
          }
          install_sesame
      - run: bun install --frozen-lockfile
      - run: bun run go:build
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('bun.lock') }}
      - run: bun node_modules/.bin/playwright install --with-deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: bun run verify:phase0:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  go:
    name: Phase 1 Go runtime
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked Tachyon
        shell: bash
        run: |
          set -euo pipefail
          version=26.36.01
          asset=ty-linux-x64
          base="https://github.com/d31ma/Tachyon/releases/download/v${version}"
          tmp="$(mktemp -d)"
          curl -fsSL "${base}/${asset}" -o "${tmp}/ty"
          curl -fsSL "${base}/SHA256SUMS" -o "${tmp}/SHA256SUMS"
          expected="$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print tolower($1) }' "${tmp}/SHA256SUMS")"
          actual="$(sha256sum "${tmp}/ty" | awk '{ print tolower($1) }')"
          test -n "$expected"
          test "$expected" = "$actual"
          sudo install -m 755 "${tmp}/ty" /usr/local/bin/ty
      - run: bun install --frozen-lockfile
      - run: bun run verify:phase1
      - name: Static and vulnerability analysis
        shell: bash
        run: |
          GOTOOLCHAIN=local go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
          GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14

  phase2:
    name: Phase 2 FYLO qualification
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOFLAGS: -buildvcs=false
      FYLO_TEST_BINARY: /usr/local/bin/fylo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked FYLO runtime and dependencies
        shell: bash
        run: |
          set -euo pipefail
          install_release() {
            local repo="$1" binary="$2" version="$3"
            local asset="${binary}-linux-x64"
            local base="https://github.com/d31ma/${repo}/releases/download/v${version}"
            local tmp
            tmp="$(mktemp -d)"
            curl -fsSL "${base}/${asset}" -o "${tmp}/${binary}"
            curl -fsSL "${base}/SHA256SUMS" -o "${tmp}/SHA256SUMS"
            local expected actual
            expected="$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print tolower($1) }' "${tmp}/SHA256SUMS")"
            actual="$(sha256sum "${tmp}/${binary}" | awk '{ print tolower($1) }')"
            test -n "$expected"
            test "$expected" = "$actual"
            sudo install -m 755 "${tmp}/${binary}" "/usr/local/bin/${binary}"
          }
          install_release Fylo fylo 26.33.02
          install_release Chex chex 26.32.02
          install_release TTID ttid 26.32.03
          install_sesame() {
            local version="26.33.02"
            local asset="sesame-linux-amd64"
            local base="https://github.com/d31ma/SESAME/releases/download/v${version}"
            local tmp
            tmp="$(mktemp -d)"
            curl -fsSL "${base}/${asset}" -o "${tmp}/sesame"
            curl -fsSL "${base}/SHA256SUMS" -o "${tmp}/SHA256SUMS"
            local expected actual
            expected="$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print tolower($1) }' "${tmp}/SHA256SUMS")"
            actual="$(sha256sum "${tmp}/sesame" | awk '{ print tolower($1) }')"
            test -n "$expected"
            test "$expected" = "$actual"
            sudo install -m 755 "${tmp}/sesame" /usr/local/bin/sesame
          }
          install_sesame
      - run: bun install --frozen-lockfile
      - run: bun run verify:phase2

  phase3:
    name: Phase 3 identity qualification
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOFLAGS: -buildvcs=false
      FYLO_TEST_BINARY: /usr/local/bin/fylo
      SESAME_TEST_BINARY: /usr/local/bin/sesame
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked identity and persistence runtimes
        shell: bash
        run: |
          set -euo pipefail
          install_release() {
            local repo="$1" binary="$2" version="$3"
            local asset="${binary}-linux-x64"
            local base="https://github.com/d31ma/${repo}/releases/download/v${version}"
            local tmp
            tmp="$(mktemp -d)"
            curl -fsSL "${base}/${asset}" -o "${tmp}/${binary}"
            curl -fsSL "${base}/SHA256SUMS" -o "${tmp}/SHA256SUMS"
            local expected actual
            expected="$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print tolower($1) }' "${tmp}/SHA256SUMS")"
            actual="$(sha256sum "${tmp}/${binary}" | awk '{ print tolower($1) }')"
            test -n "$expected"
            test "$expected" = "$actual"
            sudo install -m 755 "${tmp}/${binary}" "/usr/local/bin/${binary}"
          }
          install_release Fylo fylo 26.33.02
          install_release Chex chex 26.32.02
          install_release TTID ttid 26.32.03
          install_sesame() {
            local version="26.33.02"
            local asset="sesame-linux-amd64"
            local base="https://github.com/d31ma/SESAME/releases/download/v${version}"
            local tmp
            tmp="$(mktemp -d)"
            curl -fsSL "${base}/${asset}" -o "${tmp}/sesame"
            curl -fsSL "${base}/SHA256SUMS" -o "${tmp}/SHA256SUMS"
            local expected actual
            expected="$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print tolower($1) }' "${tmp}/SHA256SUMS")"
            actual="$(sha256sum "${tmp}/sesame" | awk '{ print tolower($1) }')"
            test -n "$expected"
            test "$expected" = "$actual"
            sudo install -m 755 "${tmp}/sesame" /usr/local/bin/sesame
          }
          install_sesame
      - run: bun install --frozen-lockfile
      - run: bun run go:build
      - run: bun run bundle
      - run: bun run verify:phase3

  required:
    name: required
    if: always()
    needs: [baseline, go, phase2, phase3, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every blocking job
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          GO_RESULT: ${{ needs.go.result }}
          PHASE2_RESULT: ${{ needs.phase2.result }}
          PHASE3_RESULT: ${{ needs.phase3.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        shell: bash
        run: |
          test "$BASELINE_RESULT" = success
          test "$GO_RESULT" = success
          test "$PHASE2_RESULT" = success
          test "$PHASE3_RESULT" = success
          test "$E2E_RESULT" = success
