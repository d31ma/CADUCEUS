name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gates:
    name: Gates
    uses: ./.github/workflows/ci.yml

  version:
    name: CalVer
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.calver.outputs.version }}
      tag_exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: calver
        run: |
          version="$(date -u +%y.%V.%u)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CalVer: $version"
      - id: check
        env:
          TAG: v${{ steps.calver.outputs.version }}
        run: |
          if git rev-parse "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; skipping the release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  github-release:
    name: Create git tag and GitHub Release
    needs: version
    if: needs.version.outputs.tag_exists == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
      - name: Create GitHub Release
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes
