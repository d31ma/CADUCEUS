<div class="contents">
  <a class="skip-link" href="#admin-content">Skip to admin content</a>
  <p class="sr-only" role="status" aria-live="polite">{adminShell.announcement}</p>
  <logic :if="adminSession.step == 'ready'">
    <div class="admin-app group/app grid h-dvh overflow-hidden grid-cols-1 sm:grid-cols-[17rem_minmax(0,1fr)] md:grid-cols-[4.25rem_17rem_minmax(0,1fr)] xl:grid-cols-[4.5rem_19rem_minmax(0,1fr)] 2xl:grid-cols-[4.5rem_21rem_minmax(0,1fr)]" :data-pane="adminShell.pane">
      <nav class="admin-rail hidden md:flex flex-col items-center gap-2 py-3" aria-label="Domains">
        <ul class="flex flex-col gap-2">
          <li><span class="domain-tile grid place-items-center" aria-current="true"><span aria-hidden="true">{adminSession.initials}</span><span class="sr-only">{adminSession.domainId}, current domain</span></span></li>
        </ul>
      </nav>
      <aside class="admin-sidebar hidden group-data-[pane=list]/app:flex sm:flex flex-col min-h-0" :aria-label="adminShell.sidebarLabel(adminSession.domainId)">
        <header class="sidebar-head flex items-center gap-2 px-4">
          <p class="domain-name min-w-0 flex-1 truncate">{adminSession.domainId}</p>
        </header>
        <div class="flex-1 min-h-0 overflow-y-auto px-2 py-3">
          <h2 class="section-title px-2" id="admin-nav-title">Admin</h2>
          <ul class="mt-1 flex flex-col gap-1" aria-labelledby="admin-nav-title">
            <logic :if="adminSession.operator">
              <li><button type="button" class="nav-item flex w-full items-center gap-2 px-2" :aria-current="adminShell.flag(adminShell.view == 'domains')" on:click="adminShell.open('domains', adminSession.domainId)"><w-icon name="globe" aria-hidden="true"></w-icon><span class="truncate">Domains</span></button></li>
            </logic>
            <logic :if="adminSession.domainAdmin">
              <li><button type="button" class="nav-item flex w-full items-center gap-2 px-2" :aria-current="adminShell.flag(adminShell.view == 'domain')" on:click="adminShell.open('domain', adminSession.domainId)"><w-icon name="globe" aria-hidden="true"></w-icon><span class="truncate">Domain</span></button></li>
              <li><button type="button" class="nav-item flex w-full items-center gap-2 px-2" :aria-current="adminShell.flag(adminShell.view == 'members')" on:click="adminShell.open('members', adminSession.domainId)"><w-icon name="users" aria-hidden="true"></w-icon><span class="truncate">Members</span></button></li>
              <li><button type="button" class="nav-item flex w-full items-center gap-2 px-2" :aria-current="adminShell.flag(adminShell.view == 'channels')" on:click="adminShell.open('channels', adminSession.domainId)"><w-icon name="hash" aria-hidden="true"></w-icon><span class="truncate">Channels</span></button></li>
            </logic>
          </ul>
        </div>
        <footer class="sidebar-foot flex items-center gap-2 px-3 py-2">
          <span class="min-w-0 flex-1"><span class="me-name block truncate">{adminSession.displayName}</span><span class="me-sub block truncate">{adminSession.domainId}</span></span>
          <w-icon-btn icon="logout" aria-label="Sign out" title="Sign out" on:click="adminSession.signOut()"></w-icon-btn>
        </footer>
      </aside>
      <div class="admin-pane hidden group-data-[pane=main]/app:block sm:block min-w-0 min-h-0 overflow-y-auto">
        <switch :value="adminShell.view">
          <case :when="'domains'"><admin-domains hydrate="load" /></case>
          <case :when="'domain'"><admin-domain hydrate="load" /></case>
          <case :when="'members'"><admin-members hydrate="load" /></case>
          <case :when="'channels'"><admin-channels hydrate="load" /></case>
        </switch>
      </div>
    </div>
  </logic>
  <logic else>
    <admin-gate hydrate="load" />
  </logic>
</div>
