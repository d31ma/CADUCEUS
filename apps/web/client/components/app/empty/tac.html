<logic :if="sidebar.state == 'empty'">
  <w-empty-state class="empty m-auto block max-w-[var(--ms-auth-card-max)] px-4 py-8">
    <span slot="media" class="empty-art grid size-16 place-items-center"><w-icon name="chat"></w-icon></span>
    <h2 slot="title" class="empty-heading">Start a conversation</h2>
    <span slot="text" class="empty-message">Nobody has written to you yet. Write to a person, a channel or any email address.</span>
    <div slot="actions" class="flex justify-center pt-2">
      <w-btn class="empty-action" variant="flat" prepend-icon="edit" on:click="sidebar.newMessage()">New message</w-btn>
    </div>
  </w-empty-state>
</logic>
<logic else>
  <w-empty-state class="empty m-auto block max-w-[var(--ms-auth-card-max)] px-4 py-8">
    <span slot="media" class="empty-art grid size-16 place-items-center"><w-icon name="chat"></w-icon></span>
    <h2 slot="title" class="empty-heading">Pick a conversation</h2>
    <span slot="text" class="empty-message">Choose a channel, a person or an email on the left. Or start something new.</span>
    <p slot="actions" class="empty-note">Tip: press <kbd>⌘K</kbd> to search.</p>
  </w-empty-state>
</logic>
