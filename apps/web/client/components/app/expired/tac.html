<w-dialog class="expired" open persistent hide-close heading-level="2" heading="Your session ended" max-width="26rem">
  <div class="flex items-start gap-3">
    <span class="expired-art grid size-11 flex-none place-items-center"><w-icon name="clock"></w-icon></span>
    <div class="grid gap-4">
      <p class="expired-text">Sign in again to keep working.</p>
      <p class="expired-meta">This happens when you sign out on another device, or when your admin changes your account.</p>
    </div>
  </div>
  <div slot="footer" class="flex w-full justify-end">
    <w-btn class="max-[768px]:w-full" variant="flat" on:click="session.signInAgain()">Sign in again</w-btn>
  </div>
</w-dialog>
