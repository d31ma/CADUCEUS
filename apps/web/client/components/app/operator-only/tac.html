<div class="auth">
  <header class="auth-brand">
    <p class="auth-wordmark"><span class="auth-wordmark-mark" aria-hidden="true"></span><span class="auth-wordmark-text">Mesail</span></p>
  </header>
  <main class="auth-main">
    <div class="auth-card auth-card-center">
      <span class="auth-art grid size-14 place-items-center"><w-icon name="shield-check"></w-icon></span>
      <div class="grid gap-2">
        <h1 class="auth-title">Your account has no domain</h1>
        <p class="auth-lead">You are an Operator of this Mesail install, but not a member of any domain. Chat and email open only inside a domain.</p>
      </div>
      <w-btn class="w-full" variant="flat" size="large" block href="/admin/">Open Mesail admin</w-btn>
      <w-btn class="w-full" variant="text" size="large" block on:click="session.signOut()">Sign out</w-btn>
    </div>
  </main>
</div>
