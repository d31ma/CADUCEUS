<nav class="rail flex h-full flex-col items-center gap-2 overflow-y-auto pt-[max(var(--w-space-3),var(--tac-titlebar-height,env(safe-area-inset-top)))] pb-[max(var(--w-space-3),env(safe-area-inset-bottom))]" aria-label="Domains">
  <ul class="m-0 flex list-none flex-col gap-2 p-0">
    <loop :for="account of sessionAccount.accounts">
      <li>
        <button type="button" class="domain-tile relative grid flex-none place-items-center p-0" :title="account.domainId" :aria-current="shell.flag(account.current)" on:click="session.switch(account.domainId)">
          <span aria-hidden="true">{account.initials}</span>
          <span class="sr-only">{account.domainId}<logic :if="account.current">, current domain</logic></span>
        </button>
      </li>
    </loop>
  </ul>
  <div class="rail-separator h-px w-8 flex-none" role="presentation"></div>
  <w-icon-btn class="rail-button" icon="plus" title="Sign in to another domain" aria-label="Sign in to another domain" on:click="session.addDomain()"></w-icon-btn>
  <div class="flex-1"></div>
  <div class="contents" on:click="notificationPush.loadSettings()">
    <button type="button" class="domain-tile relative grid flex-none place-items-center p-0" title="Settings" aria-label="Settings" :aria-current="shell.flag(shell.page == 'settings')" on:click="shell.showPage('settings')">
      <w-icon name="settings" class="tile-icon"></w-icon>
    </button>
  </div>
</nav>
