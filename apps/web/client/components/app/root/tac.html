<switch :value="session.step">
  <case :when="'signedIn'">
    <app-shell />
  </case>
  <case :when="'expired'">
    <app-shell />
    <app-expired />
  </case>
  <case :when="'signedOut'">
    <app-signedout />
  </case>
  <case :when="'choosePassword'">
    <app-password-required />
  </case>
  <case :when="'noDomainOperator'">
    <app-operator-only />
  </case>
  <case default>
    <app-signin />
  </case>
</switch>
