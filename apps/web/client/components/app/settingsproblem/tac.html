<switch :value="sessionSettings.problem">
  <case :when="'wrongPassword'">
    <w-alert type="error">The password or 2-step code is not right.</w-alert>
  </case>
  <case :when="'passwordPolicy'">
    <w-alert type="error">The new password does not meet your domain's password rules. Try a longer one.</w-alert>
  </case>
  <case :when="'invalidCode'">
    <w-alert type="error">That code is not right. Type the code your app shows now.</w-alert>
  </case>
  <case :when="'rateLimited'">
    <w-alert type="error">Too many tries. Wait a minute, then try again.</w-alert>
  </case>
  <case :when="'unavailable'">
    <w-alert type="error">We cannot reach sign-in right now. Try again in a minute.</w-alert>
  </case>
</switch>
