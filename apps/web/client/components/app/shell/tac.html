<div class="shell">
  <nav class="shell-sidebar" aria-label="Channels and conversations">
    <p class="shell-product">{shell.productName}</p>
    <search-panel />
    <sidebar-nav />
  </nav>
  <main class="shell-conversation">
    <h1>{shell.heading}</h1>
    <conversation-view />
    <composer-box />
  </main>
  <aside class="shell-thread" aria-label="Thread and notifications">
    <thread-pane />
    <notifications-list />
  </aside>
</div>
