<section class="composer flex min-w-0 flex-col" aria-label="Write a message" :data-email="composer.emailMode" :data-sending="composer.sending">
  <form method="dialog" class="contents" aria-label="Message" on:submit="composer.submitWith($event.target.elements.to.value, $event.target.elements.cc.value, $event.target.elements.bcc.value)">
    <logic :if="composer.emailMode">
      <p class="composer-mode m-0 flex items-start gap-2 px-3 py-2">
        <svg class="composer-icon mt-0.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16v12H4z" /><path d="M4 7l8 6 8-6" /></svg>
        <logic :if="composer.modeText">
          <span class="min-w-0">{composer.modeText}</span>
        </logic>
        <logic else>
          <span class="min-w-0">Reply as email.</span>
        </logic>
      </p>
    </logic>

    <composer-recipients />

    <logic :if="composer.emailMode">
      <composer-email-fields />
    </logic>

    <div class="composer-editor px-3 py-2">
      <label class="composer-sr-only" for="composer-input">{composer.emailMode ? 'Email body' : 'Message'}</label>
      <textarea id="composer-input" class="composer-textarea block w-full" name="body" rows="3" :placeholder="composer.emailMode ? 'Write your email' : 'Write a message'" :value="composer.body" on:change="composer.keepBody($event.target.value)"></textarea>
    </div>

    <composer-attachments />

    <composer-summary />

    <div class="composer-toolbar flex flex-wrap items-center gap-x-3 gap-y-2 px-3 pt-2">
      <logic :if="composer.problemText">
        <p class="composer-problem m-0 flex basis-full items-start gap-2 px-3 py-2" role="alert">
          <svg class="composer-icon mt-0.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /><path d="M12 9v4M12 17h.01" /></svg>
          <span class="min-w-0">{composer.problemText}</span>
        </p>
      </logic>
      <p class="composer-keys m-0 mr-auto min-w-0">Enter in an address field adds it · Enter in the message adds a line</p>
      <logic :if="composer.sending">
        <w-btn class="composer-send ml-auto" variant="flat" loading>Sending…</w-btn>
      </logic>
      <logic else>
        <w-btn class="composer-send ml-auto" variant="flat">
          <svg class="composer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 3 10 14" /><path d="M21 3l-6.5 18-4.5-7-7-4.5z" /></svg>
          <span>{composer.sendLabel}</span>
        </w-btn>
      </logic>
    </div>
  </form>

  <div class="composer-sr-only" aria-live="polite">{composer.announcement}</div>

  <composer-changed />
</section>
