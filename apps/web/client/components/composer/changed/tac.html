<w-dialog class="composer-changed" title="Recipients changed" close-label="Close" max-width="32rem" :open="composer.changedOpen" on:close="composer.closeChanged()">
  <div class="grid gap-3">
    <p class="composer-changed-lead m-0"><strong>Nothing was sent.</strong> Some recipients changed after you wrote this message. Check how each one gets it, then send again.</p>
    <ul class="m-0 grid gap-2 p-0" aria-label="Changed recipients">
      <loop :for="change of composer.changes">
        <li class="composer-change grid gap-1 py-2">
          <span class="composer-change-name">{change.displayName}</span>
          <span class="composer-change-sentence">{change.sentence}</span>
          <span class="flex flex-wrap items-center gap-2">
            <span class="composer-tag composer-tag-before px-2"><span class="composer-sr-only">Was </span>{change.before}</span>
            <svg class="composer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            <span class="composer-tag composer-tag-after px-2"><span class="composer-sr-only">Now </span>{change.after}</span>
          </span>
        </li>
      </loop>
    </ul>
  </div>
  <div slot="footer" class="flex flex-wrap justify-end gap-2">
    <w-btn class="composer-changed-button" variant="text" on:click="composer.closeChanged()">Cancel</w-btn>
    <w-btn class="composer-changed-button composer-changed-primary" variant="filled" on:click="composer.closeChanged()">Review and send</w-btn>
  </div>
</w-dialog>
