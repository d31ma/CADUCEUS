<div class="composer-email-fields">
  <p class="composer-field m-0 flex flex-wrap items-center gap-2 px-3 py-1">
    <span class="composer-field-label w-14 shrink-0">From</span>
    <span class="composer-from min-w-0 truncate">{composer.senderAddress}</span>
  </p>
  <div class="composer-field flex flex-wrap items-center gap-2 px-3 py-1" :data-invalid="composer.subjectMissing">
    <logic :if="composer.subjectMissing">
      <w-text-field class="composer-subject min-w-0 flex-1" name="subject" density="compact" label="Subject" error="Add a subject. An email needs one." :value="composer.subject" on:change="composer.keepSubject($event.target.value)"></w-text-field>
    </logic>
    <logic else>
      <w-text-field class="composer-subject min-w-0 flex-1" name="subject" density="compact" label="Subject" :hint="composer.subjectHint" :value="composer.subject" on:change="composer.keepSubject($event.target.value)"></w-text-field>
    </logic>
  </div>
</div>
