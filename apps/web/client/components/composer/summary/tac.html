<div class="composer-summary-region" role="status">
  <logic :if="composer.summary.length > 0">
    <ul class="composer-summary mx-3 mt-0 mb-2 grid gap-1 px-3 py-2" aria-label="Who gets what">
      <loop :for="line of composer.summary">
        <li>{line}</li>
      </loop>
      <logic :if="composer.emailMode">
        <li class="composer-summary-info">Sent from {composer.senderAddress}.</li>
      </logic>
    </ul>
  </logic>
</div>
