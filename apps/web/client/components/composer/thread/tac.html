<section class="composer-thread flex min-w-0 flex-col" aria-label="Reply in thread" :data-email="composerThread.sendToExternal">
  <div class="composer-thread-choice px-3 pt-2" :hidden="!composerThread.target.externalAddress">
    <w-checkbox class="composer-thread-check" name="sendToExternal" :label="'Send to ' + composerThread.target.externalAddress" :checked="composerThread.sendToExternal" on:change="composerThread.chooseExternal($event.target.checked)"></w-checkbox>
    <p class="composer-thread-note composer-thread-note-email m-0 mt-1 flex items-start gap-2 px-3 py-2" :hidden="!composerThread.sendToExternal">
      <svg class="composer-thread-icon mt-0.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16v12H4z" /><path d="M4 7l8 6 8-6" /></svg>
      <span class="min-w-0">This reply also goes to {composerThread.target.externalAddress} as an email.</span>
    </p>
    <p class="composer-thread-note m-0 mt-1 flex flex-wrap items-center gap-2 py-1" :hidden="composerThread.sendToExternal">
      <span class="composer-thread-tag inline-flex shrink-0 items-center gap-1 px-2">
        <svg class="composer-thread-icon composer-thread-icon-small" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
        <span>Internal</span>
      </span>
      <span class="min-w-0">Only people in {composerThread.domainId} see this reply.</span>
    </p>
  </div>

  <form method="dialog" class="contents" aria-label="Reply" on:submit="composerThread.sendWith($event.target.elements.body.value)">
    <div class="composer-thread-editor px-3 py-2">
      <label class="sr-only" for="composer-thread-input">Reply</label>
      <textarea id="composer-thread-input" class="composer-thread-textarea block w-full" name="body" rows="2" placeholder="Reply…" :value="composerThread.body" on:input="composerThread.body = $event.target.value"></textarea>
    </div>

    <div class="composer-thread-toolbar flex flex-wrap items-center gap-x-3 gap-y-2 px-3 pt-2">
      <logic :if="composerThread.problemText">
        <p class="composer-thread-problem m-0 flex basis-full items-start gap-2 px-3 py-2" role="alert">
          <svg class="composer-thread-icon mt-0.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /><path d="M12 9v4M12 17h.01" /></svg>
          <span class="min-w-0">{composerThread.problemText}</span>
        </p>
      </logic>
      <w-btn class="composer-thread-send ml-auto" variant="flat">
        <svg class="composer-thread-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 3 10 14" /><path d="M21 3l-6.5 18-4.5-7-7-4.5z" /></svg>
        <span>{composerThread.sendLabel}</span>
      </w-btn>
    </div>
  </form>

  <div class="sr-only" aria-live="polite">{composerThread.announcement}</div>
</section>
