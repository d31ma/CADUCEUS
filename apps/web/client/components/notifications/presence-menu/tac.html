<div class="presence">
  <button type="button" class="me-button" id="presence-button" aria-haspopup="dialog" aria-controls="presence-panel" :aria-expanded="shell.flag(notificationPresence.menuOpen)" :aria-label="notificationPresence.buttonLabel()" on:click="notificationPresence.toggleMenu()">
    <span class="avatar" aria-hidden="true">
      <span>{notificationPresence.initials()}</span>
      <span class="presence-mark" :data-state="notificationPresence.myState"></span>
    </span>
    <span class="me-text" aria-hidden="true">
      <span class="me-name">{notificationPresence.name()}</span>
      <span class="me-status" :data-state="notificationPresence.myState">{notificationPresence.statusText()}</span>
    </span>
  </button>

  <logic :if="notificationPresence.menuOpen">
    <div class="backdrop" on:click="notificationPresence.closeMenu()"></div>
    <div class="panel" id="presence-panel" role="dialog" aria-labelledby="presence-title">
      <span class="grip" aria-hidden="true"></span>
      <div class="panel-head">
        <span class="avatar avatar-large" aria-hidden="true">
          <span>{notificationPresence.initials()}</span>
          <span class="presence-mark" :data-state="notificationPresence.myState"></span>
        </span>
        <div class="panel-who">
          <h2 class="panel-title" id="presence-title">{notificationPresence.name()}</h2>
          <span class="meta">{notificationPresence.statusText()}</span>
        </div>
        <button type="button" class="icon-button" aria-label="Close status menu" on:click="notificationPresence.closeMenu()">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>

      <ul class="menu" role="menu" aria-label="Your status">
        <li role="none">
          <button type="button" class="menu-item" role="menuitemradio" :aria-checked="shell.flag(notificationPresence.myState != 'dnd')" on:click="notificationPresence.setActive()">
            <span class="presence-mark presence-mark-inline" data-state="active" aria-hidden="true"></span>
            <span class="menu-text">
              <span>Active</span>
              <span class="menu-description">Automatic. Shows Idle while Mesail is in the background.</span>
            </span>
            <svg class="icon icon-small menu-check" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12l5 5 9-10" /></svg>
          </button>
        </li>
        <li role="none">
          <span class="menu-group-label" id="presence-dnd-label">
            <span class="presence-mark presence-mark-inline" data-state="dnd" aria-hidden="true"></span>
            <span class="menu-text">
              <span>Do not disturb</span>
              <span class="menu-description">No notifications. Mentions wait in Activity.</span>
            </span>
          </span>
          <ul class="menu" role="group" aria-labelledby="presence-dnd-label">
            <loop :for="choice of notificationPresence.choices">
              <li role="none">
                <button type="button" class="menu-item menu-item-indent" role="menuitemradio" :aria-checked="shell.flag(choice.selected)" on:click="notificationPresence.doNotDisturb(choice.name)">
                  <span class="menu-text">
                    <span>{choice.label}</span>
                    <span class="menu-description">{choice.endText}</span>
                  </span>
                  <svg class="icon icon-small menu-check" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12l5 5 9-10" /></svg>
                </button>
              </li>
            </loop>
          </ul>
        </li>
        <logic :if="notificationPresence.myState == 'dnd'">
          <li class="menu-separator" role="separator"></li>
          <li role="none">
            <button type="button" class="menu-item" role="menuitem" on:click="notificationPresence.setActive()">
              <svg class="icon icon-small" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9" /><path d="M10 20.5a2 2 0 0 0 4 0" /></svg>
              <span class="menu-text">
                <span>Clear do not disturb</span>
                <span class="menu-description">{notificationPresence.statusText()}</span>
              </span>
            </button>
          </li>
        </logic>
      </ul>

      <logic :if="notificationPresence.problem == 'error'">
        <p class="problem" role="alert">Your status did not change. Check your connection and try again.</p>
      </logic>
      <logic :if="notificationPresence.problem == 'session'">
        <p class="problem" role="alert">Your session ended. Sign in again to change your status.</p>
      </logic>
    </div>
  </logic>
</div>
