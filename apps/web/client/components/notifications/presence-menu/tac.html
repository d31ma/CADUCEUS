<div class="relative flex min-w-0">
  <button type="button" class="presence-me flex min-h-11 min-w-0 flex-1 items-center gap-2 px-2 py-1" id="presence-button" aria-haspopup="dialog" aria-controls="presence-panel" :aria-expanded="shell.flag(notificationPresence.menuOpen)" :aria-label="notificationPresence.buttonLabel()" on:click="notificationPresence.toggleMenu()">
    <span class="relative inline-flex flex-none" aria-hidden="true">
      <w-avatar :text="notificationPresence.initials()" size="28" alt=""></w-avatar>
      <span class="presence-mark" :data-state="notificationPresence.myState"></span>
    </span>
    <span class="grid min-w-0 flex-1" aria-hidden="true">
      <span class="presence-name truncate">{notificationPresence.name()}</span>
      <span class="presence-meta truncate">{notificationPresence.statusText()}</span>
    </span>
  </button>

  <logic :if="notificationPresence.menuOpen">
    <div class="presence-backdrop fixed inset-0 z-50 sm:hidden" on:click="notificationPresence.closeMenu()"></div>
    <div class="presence-panel fixed inset-x-0 bottom-0 z-[51] max-h-[85dvh] overflow-y-auto p-1 pb-[calc(0.75rem+env(safe-area-inset-bottom))] sm:absolute sm:inset-x-auto sm:bottom-[calc(100%+0.25rem)] sm:start-0 sm:z-40 sm:max-h-[calc(100dvh-6rem)] sm:w-80 sm:max-w-[calc(100vw-2rem)] sm:pb-1" id="presence-panel" role="dialog" aria-labelledby="presence-title">
      <div class="presence-grip mx-auto mt-1 h-1 w-10 sm:hidden" aria-hidden="true"></div>
      <div class="presence-divider-below mb-1 flex items-center gap-3 py-2 ps-3 pe-1">
        <span class="relative inline-flex flex-none" aria-hidden="true">
          <w-avatar :text="notificationPresence.initials()" size="36" alt=""></w-avatar>
          <span class="presence-mark" :data-state="notificationPresence.myState"></span>
        </span>
        <span class="grid min-w-0 flex-1">
          <h2 id="presence-title" class="presence-name truncate">{notificationPresence.name()}</h2>
          <span class="presence-meta truncate">{notificationPresence.statusText()}</span>
        </span>
        <w-icon-btn icon="close" size="small" class="max-sm:size-11 pointer-coarse:size-11" aria-label="Close status menu" on:click="notificationPresence.closeMenu()"></w-icon-btn>
      </div>

      <ul class="presence-list m-0 p-0" role="menu" aria-label="Your status">
        <li role="none">
          <button type="button" class="presence-item group flex min-h-9 w-full items-start gap-2 px-3 py-2 max-sm:min-h-11 pointer-coarse:min-h-11" role="menuitemradio" :aria-checked="shell.flag(notificationPresence.myState != 'dnd')" on:click="notificationPresence.setActive()">
            <span class="presence-mark presence-mark-inline mt-1.5" data-state="active" aria-hidden="true"></span>
            <span class="min-w-0 flex-1">Active<span class="presence-description block">Automatic. Shows Idle while Mesail is in the background.</span></span>
            <w-icon name="check" class="presence-check ms-auto invisible group-aria-checked:visible"></w-icon>
          </button>
        </li>
        <li role="none">
          <div class="presence-group-label flex items-start gap-2 px-3 pb-1 pt-2" id="presence-dnd-label">
            <span class="presence-mark presence-mark-inline mt-1.5" data-state="dnd" aria-hidden="true"></span>
            <span>Do not disturb<span class="presence-description block">No notifications. Mentions wait in Activity.</span></span>
          </div>
          <ul class="presence-list m-0 p-0" role="group" aria-labelledby="presence-dnd-label">
            <loop :for="choice of notificationPresence.choices">
              <li role="none">
                <button type="button" class="presence-item group flex min-h-9 w-full items-start gap-2 py-2 ps-8 pe-3 max-sm:min-h-11 pointer-coarse:min-h-11" role="menuitemradio" :aria-checked="shell.flag(choice.selected)" on:click="notificationPresence.doNotDisturb(choice.name)">
                  <span class="min-w-0 flex-1">{choice.label}<span class="presence-description block">{choice.endText}</span></span>
                  <w-icon name="check" class="presence-check ms-auto invisible group-aria-checked:visible"></w-icon>
                </button>
              </li>
            </loop>
          </ul>
        </li>
        <logic :if="notificationPresence.myState == 'dnd'">
          <li class="presence-separator my-1 h-px" role="separator"></li>
          <li role="none">
            <button type="button" class="presence-item flex min-h-9 w-full items-start gap-2 px-3 py-2 max-sm:min-h-11 pointer-coarse:min-h-11" role="menuitem" on:click="notificationPresence.setActive()">
              <w-icon name="bell" class="presence-icon-small mt-0.5"></w-icon>
              <span class="min-w-0 flex-1">Clear do not disturb<span class="presence-description block">{notificationPresence.statusText()}</span></span>
            </button>
          </li>
        </logic>
      </ul>

      <logic :if="notificationPresence.problem == 'error'">
        <p class="presence-problem mx-2 my-1 px-3 py-2" role="alert">Your status did not change. Check your connection and try again.</p>
      </logic>
      <logic :if="notificationPresence.problem == 'session'">
        <p class="presence-problem mx-2 my-1 px-3 py-2" role="alert">Your session ended. Sign in again to change your status.</p>
      </logic>
    </div>
  </logic>
</div>
