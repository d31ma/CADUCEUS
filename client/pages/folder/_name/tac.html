<app-shell>
<logic :if="canUseApp">
  <div :class="'mail-layout' + (selectedMail ? ' show-detail' : '')">
    <div class="mail-list-panel">
      <inbox-view :folder="folderName" />
    </div>
    <div class="column-resizer mail-column-resizer" data-column-resizer="mail" role="separator" aria-label="Resize message list" aria-orientation="vertical" aria-valuemin="280" aria-valuemax="640" aria-valuenow="390" tabindex="0"></div>
    <div class="mail-detail-panel">
      <logic :if="selectedMail">
        <email-detail :email-id="selectedMail" />
      </logic>
      <logic :if="!selectedMail">
        <div class="mail-detail-empty">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;">
              <path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/>
            </svg>
            <p class="empty-state-title">No message selected</p>
            <p class="empty-state-subtitle">Choose a message from the list to read it here.</p>
          </div>
        </div>
      </logic>
    </div>
  </div>
</logic>
<logic :if="canShowLogin">
  <div class="login-screen"><login-form :brandlogo="'/shared/assets/favicon.svg'" /></div>
</logic>
</app-shell>
