services:
  blobs-folder:
    image: mesail-scheduler:${MESAIL_IMAGE_TAG:-dev}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "mkdir -p /volume/blobs && chown 10001:10001 /volume/blobs"]
    network_mode: none
    volumes:
      - blobs:/volume

  router:
    depends_on:
      blobs-folder:
        condition: service_completed_successfully
    environment:
      MESAIL_ROUTER_BLOBS_FOLDER: /blobs
      MESAIL_ROUTER_BLOBS_BASE: http://127.0.0.1:${MESAIL_ROUTER_PORT:-18080}/blobs
      MESAIL_ROUTER_BLOBS_SECRET: ${MESAIL_LINK_SECRET:?run scripts/floci/run-all.sh}
    volumes:
      - type: volume
        source: blobs
        target: /blobs
        volume:
          subpath: blobs

volumes:
  blobs:
    name: ${MESAIL_BLOBS_VOLUME:?run scripts/floci/blobs.sh}
    external: true
