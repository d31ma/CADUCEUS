db=postgres
db-driver=org.sqlite.JDBC
db-dialect=org.hibernate.community.dialect.SQLiteDialect
db-pool-initial-size=1
db-pool-min-size=1
db-pool-max-size=8
spi-dblock--provider=sqlite
spi-connections-liquibase--provider=sqlite
health-enabled=true
metrics-enabled=false
cache=local
http-enabled=true
http-host=127.0.0.1
http-port=8180
http-management-port=9180
http-relative-path=/idp
proxy-headers=xforwarded
hostname-backchannel-dynamic=true
log-level=INFO,org.keycloak.quarkus.runtime.storage.database.jpa.QuarkusJpaConnectionProviderFactory:ERROR,org.keycloak.connections.jpa.PostgreSQLAsyncCommitIntegrator:ERROR
