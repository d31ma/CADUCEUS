name: mesail

x-dev-credentials: &dev-credentials
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1

services:
  floci:
    profiles: [floci]
    image: floci/floci:2.4.0@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
    user: "0:0"
    environment:
      FLOCI_SERVICES_DOCKER_NETWORK: mesail_floci_backend
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_SERVICES_LAMBDA_HONOUR_ARCHITECTURES: "true"
    ports:
      - "127.0.0.1:${MESAIL_FLOCI_PORT:-4566}:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [backend]

  keycloak:
    image: ${MESAIL_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41}
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${MESAIL_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${MESAIL_KEYCLOAK_ADMIN_PASSWORD:-mesail-dev-admin}
      KC_HOSTNAME: ${MESAIL_ISSUER_ORIGIN:-https://mesail.localhost}/idp
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${MESAIL_KEYCLOAK_PORT:-18180}:8080"
    networks: [backend]

  router:
    image: mesail-router:dev
    environment:
      <<: *dev-credentials
      MESAIL_ROUTER_SERVICES: identity,directory,channels,messaging,attachments,realtime,notify,search,mail-in,mail-out
      MESAIL_ROUTER_LAMBDA_ENDPOINT: http://floci:4566
      MESAIL_ROUTER_STATIC_BUCKET: mesail-static
      MESAIL_ROUTER_KEYCLOAK_URL: http://keycloak:8080
      MESAIL_ROUTER_SINGLE_WRITERS: ${MESAIL_SINGLE_WRITERS:-}
    ports:
      - "127.0.0.1:${MESAIL_ROUTER_PORT:-18080}:8080"
    networks: [backend]

networks:
  backend:
    name: mesail_floci_backend
