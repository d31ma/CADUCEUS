name: mesail

x-dev-credentials: &dev-credentials
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1

services:
  floci:
    profiles: [floci]
    image: floci/floci:2.4.0@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
    user: "0:0"
    environment:
      FLOCI_SERVICES_DOCKER_NETWORK: mesail_floci_backend
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_SERVICES_LAMBDA_HONOUR_ARCHITECTURES: "true"
    ports:
      - "127.0.0.1:${MESAIL_FLOCI_PORT:-4566}:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [backend]

  keycloak:
    image: mesail-keycloak-blackbox:${MESAIL_IMAGE_TAG:-dev}
    environment:
      MESAIL_KEYCLOAK_URL: ${MESAIL_ISSUER_ORIGIN:-https://mesail.localhost}/idp
      MESAIL_KEYCLOAK_DOMAINS: ${MESAIL_KEYCLOAK_DOMAINS:-example.com,example.org,partner.test}
      MESAIL_KEYCLOAK_DEV_USERS: "true"
      KC_HTTP_HOST: 0.0.0.0
      KC_HTTP_PORT: "8080"
      MESAIL_IDENTITY_CLIENT_SECRET: ${MESAIL_IDENTITY_CLIENT_SECRET:?run scripts/floci/run-all.sh}
      MESAIL_SERVICE_SECRET: ${MESAIL_SERVICE_SECRET:?run scripts/floci/run-all.sh}
      MESAIL_ACCOUNT_CLIENT_SECRET: ${MESAIL_ACCOUNT_CLIENT_SECRET:?run scripts/floci/run-all.sh}
      MESAIL_KEYCLOAK_DIRECTORY_SECRET: ${MESAIL_KEYCLOAK_DIRECTORY_SECRET:?run scripts/floci/run-all.sh}
      KC_BOOTSTRAP_ADMIN_CLIENT_ID: mesail-bootstrap
      KC_BOOTSTRAP_ADMIN_CLIENT_SECRET: ${KC_BOOTSTRAP_ADMIN_CLIENT_SECRET:?run scripts/floci/run-all.sh}
    tmpfs:
      - /data/keycloak:uid=1000,gid=0,mode=0770
    ports:
      - "127.0.0.1:${MESAIL_KEYCLOAK_PORT:-18180}:8080"
    networks: [backend]

  realtime:
    image: mesail-realtime:${MESAIL_IMAGE_TAG:-dev}
    init: true
    stop_grace_period: 40s
    environment:
      MESAIL_REALTIME_GATEWAY_SECRET: ${MESAIL_REALTIME_GATEWAY_SECRET:?run scripts/floci/run-all.sh}
      MESAIL_REALTIME_ORIGINS: ${MESAIL_PUBLIC_URL:-http://127.0.0.1:18080}
      YON_SERVICE_CLIENT_SECRET: ${MESAIL_SERVICE_SECRET:?run scripts/floci/run-all.sh}
    volumes:
      - realtime-data:/data
    networks: [backend]

  router:
    image: mesail-router:dev
    environment:
      <<: *dev-credentials
      MESAIL_ROUTER_SERVICES: identity,directory,channels,messaging,attachments,notify,search,mail-in,mail-out
      MESAIL_ROUTER_PASSTHROUGH: /api/v1/realtime/socket=http://realtime:8116,/api/v1/realtime/stream=http://realtime:8116,/api/v1/realtime/=http://realtime:8106
      MESAIL_ROUTER_LAMBDA_ENDPOINT: http://floci:4566
      MESAIL_ROUTER_STATIC_BUCKET: mesail-static
      MESAIL_ROUTER_KEYCLOAK_URL: http://keycloak:8080
      MESAIL_ROUTER_SINGLE_WRITERS: ${MESAIL_SINGLE_WRITERS:-}
    ports:
      - "127.0.0.1:${MESAIL_ROUTER_PORT:-18080}:8080"
    networks: [backend]

  scheduler:
    image: mesail-scheduler:${MESAIL_IMAGE_TAG:-dev}
    environment:
      MESAIL_SCHEDULER_TOKEN_URL: http://keycloak:8080/idp/realms/mesail-operators/protocol/openid-connect/token
      MESAIL_SCHEDULER_CLIENT_SECRET: ${MESAIL_SERVICE_SECRET:?run scripts/floci/run-all.sh}
      MESAIL_SCHEDULER_BASE: http://router:8080
      MESAIL_SCHEDULER_PATHS: ${MESAIL_SCHEDULER_PATHS:-}
      MESAIL_SCHEDULER_SECONDS: ${MESAIL_SCHEDULER_SECONDS:-60}
    networks: [backend]

networks:
  backend:
    name: mesail_floci_backend

volumes:
  realtime-data:
    name: mesail-realtime-data
