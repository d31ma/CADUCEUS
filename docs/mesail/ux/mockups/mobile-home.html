<!doctype html>
<html lang="en" w-theme="light" w-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesail mockup: phone home</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/screens/shell.css">
<script src="assets/vendor/duvay-mesail.js" defer></script>
<script src="assets/mockup.js" defer></script>
</head>
<body class="bg-surface text-text">
<a class="ms-skip-link" href="#m-sec-channels">Skip to channels</a>

<div class="h-dvh group/app relative grid overflow-hidden
  grid-cols-1 grid-rows-[minmax(0,1fr)_auto]
  sm:grid-rows-1 sm:grid-cols-[17rem_minmax(0,1fr)]
  md:grid-cols-[4.25rem_17rem_minmax(0,1fr)]
  xl:grid-cols-[4.5rem_19rem_minmax(0,1fr)]
  2xl:grid-cols-[4.5rem_21rem_minmax(0,1fr)]" data-pane="list">

  <!-- Domain rail (960 px and up) -->
  <nav class="ms-rail hidden md:flex flex-col items-center gap-2 pb-3 pt-3 safe-t overflow-y-auto" aria-label="Domains">
    <ul class="flex flex-col gap-2">
      <li><a class="ms-domain-tile" href="#" aria-current="true" title="example.com" aria-label="example.com, current domain">Ex</a></li>
      <li><a class="ms-domain-tile" href="#" title="example.org" aria-label="example.org, 3 mentions">Eo<w-badge content="3" inline class="absolute -top-1 -right-1.5"></w-badge></a></li>
      <li><a class="ms-domain-tile" href="#" title="lab.example.net" aria-label="lab.example.net, unread messages"><span class="absolute -left-2.5 size-2 rounded-full bg-on-rail" aria-hidden="true"></span>La</a></li>
    </ul>
    <div class="flex-1"></div>
    <a class="ms-domain-tile" href="settings-appearance.html" aria-label="Help and keyboard shortcuts" title="Help"><w-icon name="info"></w-icon></a>
  </nav>

  <!-- Sidebar: list pane on phones, always visible from 600 px -->
  <aside class="ms-sidebar hidden group-data-[pane=list]/app:flex sm:flex flex-col min-h-0 bg-sidebar border-r border-divider" aria-label="Conversations in example.com">
    <h1 class="sr-only">example.com conversations</h1>
    <header class="flex items-center gap-1 min-h-13 short:min-h-11 safe-t safe-l pl-2 pr-2 border-b border-divider drag-region" style="--ms-edge: 0.5rem">
      <w-btn variant="text" class="no-drag font-bold" append-icon="chevron-down" aria-haspopup="menu" aria-expanded="false" aria-label="example.com. Switch domain or open domain menu. 3 mentions in other domains">example.com</w-btn>
      <w-badge content="3" inline class="sm:hidden" aria-hidden="true"></w-badge>
      <span class="flex-1"></span>
      <w-icon-btn class="no-drag max-sm:hidden" icon="edit" aria-label="New message" title="New message (N)"></w-icon-btn>
      <button type="button" class="no-drag touch-target grid place-items-center rounded-md hover:bg-hover sm:hidden" aria-haspopup="menu" aria-label="Ana Ruiz, active. Open status and account menu"><w-avatar text="AR" size="28" status="online" style="--h:195" alt=""></w-avatar></button>
    </header>
    <div class="px-3 py-2">
      <button type="button" class="flex w-full items-center gap-2 min-h-9 pointer-coarse:min-h-11 rounded-md border border-border bg-surface px-3 text-sm text-subtle hover:border-outline" aria-keyshortcuts="Control+K Meta+K">
        <w-icon name="search" class="ms-icon-sm"></w-icon>Search<w-hotkey keys="cmd+k" class="ml-auto pointer-coarse:hidden"></w-hotkey>
      </button>
    </div>
    <div class="flex-1 overflow-y-auto px-2 pb-24 sm:pb-4">
      <w-list nav density="compact" aria-label="Shortcuts">
        <w-list-item href="activity.html" title="Activity"><w-icon slot="prepend" name="bell"></w-icon><w-badge slot="append" content="2" inline label="2 mentions"></w-badge></w-list-item>
        <w-list-item href="#" title="Threads"><w-icon slot="prepend" name="thread"></w-icon></w-list-item>
      </w-list>

      <section class="mt-3" aria-labelledby="m-sec-channels">
        <div class="flex items-center gap-1 px-1">
          <button type="button" class="ms-section-toggle flex flex-1 items-center gap-1 min-h-7 pointer-coarse:min-h-11 rounded-sm px-1 text-xs font-semibold uppercase tracking-wide text-subtle hover:text-text" aria-expanded="true" id="m-sec-channels"><w-icon name="chevron-down" class="ms-icon-sm"></w-icon>Channels</button>
          <w-icon-btn icon="plus" size="small" aria-label="Add or browse channels"></w-icon-btn>
        </div>
        <w-list nav density="compact" aria-labelledby="m-sec-channels">
          <w-list-item href="#" title="general"><w-icon slot="prepend" name="hash"></w-icon></w-list-item>
          <w-list-item href="#" title="releases"><w-icon slot="prepend" name="hash"></w-icon></w-list-item>
          <w-list-item href="channel-email.html" title="support" class="ms-unread"><w-icon slot="prepend" name="hash"></w-icon><span slot="append" class="flex items-center gap-1"><w-icon name="mail" class="ms-icon-sm text-email" role="img" aria-label="Has an email address"></w-icon><w-badge content="4" inline class="ms-count" label="4 unread"></w-badge></span></w-list-item>
          <w-list-item href="#" title="design" class="ms-unread"><w-icon slot="prepend" name="lock" role="img" aria-label="Private channel"></w-icon><w-badge slot="append" content="1" inline label="1 mention"></w-badge></w-list-item>
          <w-list-item href="#" title="random" class="ms-muted"><w-icon slot="prepend" name="hash"></w-icon><w-icon slot="append" name="bell-off" class="ms-icon-sm" role="img" aria-label="Muted"></w-icon></w-list-item>
          <w-list-item href="channel-browse.html" title="Browse channels"><w-icon slot="prepend" name="search" class="ms-icon-sm"></w-icon></w-list-item>
        </w-list>
      </section>

      <section class="mt-3" aria-labelledby="m-sec-dms">
        <div class="flex items-center gap-1 px-1">
          <button type="button" class="ms-section-toggle flex flex-1 items-center gap-1 min-h-7 pointer-coarse:min-h-11 rounded-sm px-1 text-xs font-semibold uppercase tracking-wide text-subtle hover:text-text" aria-expanded="true" id="m-sec-dms"><w-icon name="chevron-down" class="ms-icon-sm"></w-icon>Direct messages</button>
          <w-icon-btn icon="plus" size="small" aria-label="New direct message"></w-icon-btn>
        </div>
        <w-list nav density="compact" aria-labelledby="m-sec-dms">
          <w-list-item href="mobile-conversation.html" title="Bo Lee" class="ms-unread"><w-avatar slot="prepend" text="BL" size="20" status="online" style="--h:20" alt="Bo Lee, active"></w-avatar><w-badge slot="append" content="1" inline label="1 unread"></w-badge></w-list-item>
          <w-list-item href="#" title="Chen Wu"><w-avatar slot="prepend" text="CW" size="20" status="away" style="--h:280" alt="Chen Wu, idle"></w-avatar></w-list-item>
          <w-list-item href="#" title="Dara Okafor"><w-avatar slot="prepend" text="DO" size="20" status="busy" style="--h:140" alt="Dara Okafor, do not disturb"></w-avatar></w-list-item>
          <w-list-item href="#" title="Bo, Chen, Dara"><w-avatar slot="prepend" text="3" size="20" alt="Group of 3"></w-avatar></w-list-item>
        </w-list>
      </section>

      <section class="mt-3" aria-labelledby="m-sec-email">
        <div class="flex items-center gap-1 px-1">
          <button type="button" class="ms-section-toggle flex flex-1 items-center gap-1 min-h-7 pointer-coarse:min-h-11 rounded-sm px-1 text-xs font-semibold uppercase tracking-wide text-subtle hover:text-text" aria-expanded="true" id="m-sec-email"><w-icon name="chevron-down" class="ms-icon-sm"></w-icon>Email</button>
          <w-icon-btn icon="plus" size="small" aria-label="New email"></w-icon-btn>
        </div>
        <w-list nav density="compact" lines="two" aria-labelledby="m-sec-email">
          <w-list-item href="email-inbound-new.html" title="Dan Hale" subtitle="Question about invoice 2291" class="ms-unread"><w-avatar slot="prepend" text="DH" size="20" class="ms-external" alt="Dan Hale, outside example.com"></w-avatar><w-badge slot="append" content="1" inline class="ms-count" label="1 unread"></w-badge></w-list-item>
          <w-list-item href="email-conversation.html" title="Carol Diaz, Bo Lee" subtitle="Contract renewal 2027"><w-avatar slot="prepend" text="CD" size="20" class="ms-external" alt="Carol Diaz, outside example.com"></w-avatar></w-list-item>
        </w-list>
      </section>
    </div>
    <w-fab label="New message" icon="edit" aria-label="New message" aria-keyshortcuts="N" class="fixed right-4 z-20 bottom-[calc(4.5rem+env(safe-area-inset-bottom,0px))] sm:hidden"></w-fab>
    <footer class="flex items-center gap-2 border-t border-divider px-3 py-2 safe-b group-data-[pane=list]/app:max-sm:hidden">
      <button type="button" class="flex min-w-0 flex-1 items-center gap-2 rounded-md p-1 text-left hover:bg-hover" aria-haspopup="menu" aria-label="Ana Ruiz, active. Open status and account menu">
        <w-avatar text="AR" size="28" status="online" style="--h:195" alt=""></w-avatar>
        <span class="min-w-0"><span class="block truncate text-sm font-semibold">Ana Ruiz</span><span class="block truncate text-xs text-subtle">ana@example.com</span></span>
      </button>
      <w-icon-btn icon="settings" href="settings.html" aria-label="Settings"></w-icon-btn>
    </footer>
  </aside>

  <!-- Main (600 px and up): nothing picked yet -->
  <main class="hidden group-data-[pane=main]/app:flex sm:flex flex-col min-w-0 min-h-0 bg-surface @container/main" aria-labelledby="pick-title">
    <div class="flex-1 min-h-0 overflow-y-auto grid place-items-center px-4 py-8">
      <w-empty-state class="block max-w-md">
        <w-icon slot="media" name="chat" class="[--ms-icon-size:2.5rem]"></w-icon>
        <h2 slot="title" id="pick-title">Pick a conversation</h2>
        <span slot="text">Choose a channel, a person or an email on the left. Or start something new.</span>
        <div slot="actions" class="grid justify-items-center gap-2">
          <w-btn variant="filled" prepend-icon="edit">New message</w-btn>
          <p class="text-xs text-subtle pointer-coarse:hidden">Tip: press <w-hotkey keys="cmd+k"></w-hotkey> to search.</p>
        </div>
      </w-empty-state>
    </div>
  </main>

  <!-- Bottom navigation: phones, list pane only -->
  <w-bottom-navigation grow class="sm:hidden group-data-[pane=main]/app:hidden group-data-[pane=thread]/app:hidden" value="home" aria-label="Main">
    <w-bottom-nav-item value="home" label="Home" href="?pane=list" active><w-icon name="chat"></w-icon></w-bottom-nav-item>
    <w-bottom-nav-item value="activity" label="Activity" href="activity.html"><w-icon name="bell"></w-icon></w-bottom-nav-item>
    <w-bottom-nav-item value="search" label="Search" href="search.html"><w-icon name="search"></w-icon></w-bottom-nav-item>
    <w-bottom-nav-item value="you" label="You" href="settings.html"><w-icon name="user"></w-icon></w-bottom-nav-item>
  </w-bottom-navigation>

</div>

<div class="sr-only" aria-live="polite" id="announcer"></div>
</body>
</html>
