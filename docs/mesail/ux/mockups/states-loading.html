<!doctype html>
<html lang="en" w-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesail mockup: loading</title>
<link rel="stylesheet" href="assets/duvay/tokens.css">
<link rel="stylesheet" href="assets/duvay/themes.css">
<link rel="stylesheet" href="assets/mesail-tokens.css">
<link rel="stylesheet" href="assets/icons.css">
<link rel="stylesheet" href="assets/mesail.css">
<link rel="stylesheet" href="assets/screens/shell.css">
<script src="assets/mockup.js" defer></script>
</head>
<body>
<div class="ms-app" data-pane="main" aria-busy="true">

  <!-- Domain rail: tiles load with the session -->
  <nav class="ms-rail" aria-label="Domains">
    <ul class="ms-rail__list">
      <li><a class="ms-domain-tile" href="#" aria-current="true" title="example.com" aria-label="example.com, current domain">Ex</a></li>
      <li><span class="ms-skel-tile" aria-hidden="true"></span></li>
      <li><span class="ms-skel-tile" aria-hidden="true"></span></li>
    </ul>
    <div class="ms-rail__sep" role="presentation"></div>
    <span class="ms-skel-tile" aria-hidden="true"></span>
  </nav>

  <!-- Sidebar: domain name is known from the route; the lists are loading -->
  <aside class="ms-sidebar" aria-label="Conversations in example.com">
    <div class="ms-sidebar__head">
      <button class="ms-domain-name" aria-haspopup="menu" aria-expanded="false"><span>example.com</span><span class="ms-icon ms-i-chevron-down ms-icon--sm" aria-hidden="true"></span></button>
    </div>
    <div class="ms-sidebar__search">
      <button class="ms-search" aria-label="Search example.com" disabled><span class="ms-icon ms-i-search ms-icon--sm" aria-hidden="true"></span>Search</button>
    </div>
    <div class="ms-sidebar__scroll" aria-hidden="true">
      <div class="ms-nav-section">
        <div class="ms-skel-nav"><span class="ms-skeleton ms-skeleton--line" style="width:36%"></span></div>
        <div class="ms-skel-nav"><span class="ms-skeleton ms-skeleton--box"></span><span class="ms-skeleton ms-skeleton--line" style="width:58%"></span></div>
        <div class="ms-skel-nav"><span class="ms-skeleton ms-skeleton--box"></span><span class="ms-skeleton ms-skeleton--line" style="width:44%"></span></div>
        <div class="ms-skel-nav"><span class="ms-skeleton ms-skeleton--box"></span><span class="ms-skeleton ms-skeleton--line" style="width:66%"></span></div>
        <div class="ms-skel-nav"><span class="ms-skeleton ms-skeleton--box"></span><span class="ms-skeleton ms-skeleton--line" style="width:50%"></span></div>
      </div>
      <div class="ms-nav-section">
        <div class="ms-skel-nav"><span class="ms-skeleton ms-skeleton--line" style="width:52%"></span></div>
        <div class="ms-skel-nav"><span class="ms-skeleton ms-skeleton--box"></span><span class="ms-skeleton ms-skeleton--line" style="width:48%"></span></div>
        <div class="ms-skel-nav"><span class="ms-skeleton ms-skeleton--box"></span><span class="ms-skeleton ms-skeleton--line" style="width:62%"></span></div>
        <div class="ms-skel-nav"><span class="ms-skeleton ms-skeleton--box"></span><span class="ms-skeleton ms-skeleton--line" style="width:40%"></span></div>
      </div>
    </div>
    <div class="ms-sidebar__foot" aria-hidden="true">
      <span class="ms-skeleton ms-skeleton--box" style="width:var(--ms-avatar-sm);height:var(--ms-avatar-sm)"></span>
      <span class="ms-skeleton ms-skeleton--line" style="width:50%"></span>
    </div>
  </aside>

  <!-- Main: header and messages are loading -->
  <main class="ms-main" aria-labelledby="load-title">
    <header class="ms-header">
      <a class="ms-icon-btn ms-header__back" href="?pane=list" aria-label="Back to conversations"><span class="ms-icon ms-i-arrow-left" aria-hidden="true"></span></a>
      <h1 class="ms-sr-only" id="load-title">Loading example.com</h1>
      <div class="ms-skel-head" aria-hidden="true"><span class="ms-skeleton ms-skeleton--title" style="width:8rem"></span><span class="ms-skeleton ms-skeleton--line" style="width:30%"></span></div>
    </header>
    <div class="ms-timeline" aria-hidden="true">
      <div class="ms-skel-msg"><span class="ms-skeleton ms-skeleton--avatar"></span><div class="ms-skel-msg__lines"><span class="ms-skeleton ms-skeleton--line" style="width:30%"></span><span class="ms-skeleton ms-skeleton--line" style="width:86%"></span><span class="ms-skeleton ms-skeleton--line" style="width:54%"></span></div></div>
      <div class="ms-skel-msg"><span class="ms-skeleton ms-skeleton--avatar"></span><div class="ms-skel-msg__lines"><span class="ms-skeleton ms-skeleton--line" style="width:24%"></span><span class="ms-skeleton ms-skeleton--line" style="width:70%"></span></div></div>
      <div class="ms-skel-msg"><span class="ms-skeleton ms-skeleton--avatar"></span><div class="ms-skel-msg__lines"><span class="ms-skeleton ms-skeleton--line" style="width:34%"></span><span class="ms-skeleton ms-skeleton--line" style="width:92%"></span><span class="ms-skeleton ms-skeleton--line" style="width:80%"></span><span class="ms-skeleton ms-skeleton--line" style="width:40%"></span></div></div>
      <div class="ms-skel-msg"><span class="ms-skeleton ms-skeleton--avatar"></span><div class="ms-skel-msg__lines"><span class="ms-skeleton ms-skeleton--line" style="width:22%"></span><span class="ms-skeleton ms-skeleton--line" style="width:60%"></span></div></div>
    </div>
    <div class="ms-composer-wrap" aria-hidden="true"><span class="ms-skeleton ms-skeleton--composer"></span></div>
  </main>

  <nav class="ms-bottom-nav" aria-label="Main">
    <a class="ms-bottom-nav__item" href="mobile-home.html" aria-current="page"><span class="ms-icon ms-i-chat" aria-hidden="true"></span>Home</a>
    <a class="ms-bottom-nav__item" href="activity.html"><span class="ms-icon ms-i-bell" aria-hidden="true"></span>Activity<span class="ms-badge ms-badge--mention" aria-label="2 mentions">2</span></a>
    <a class="ms-bottom-nav__item" href="search.html"><span class="ms-icon ms-i-search" aria-hidden="true"></span>Search</a>
    <a class="ms-bottom-nav__item" href="settings.html"><span class="ms-icon ms-i-user" aria-hidden="true"></span>You</a>
  </nav>

</div>
<p class="ms-sr-only" role="status">Loading example.com</p>

<div class="ms-sr-only" aria-live="polite" id="announcer"></div>
</body>
</html>
