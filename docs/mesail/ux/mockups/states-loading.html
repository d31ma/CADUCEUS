<!doctype html>
<html lang="en" w-theme="light" w-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesail mockup: loading</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/screens/shell.css">
<script src="assets/vendor/duvay-mesail.js" defer></script>
<script src="assets/mockup.js" defer></script>
</head>
<body class="bg-surface text-text">
<div class="h-dvh group/app relative grid overflow-hidden
  grid-cols-1 grid-rows-[minmax(0,1fr)_auto]
  sm:grid-rows-1 sm:grid-cols-[17rem_minmax(0,1fr)]
  md:grid-cols-[4.25rem_17rem_minmax(0,1fr)]
  xl:grid-cols-[4.5rem_19rem_minmax(0,1fr)]
  2xl:grid-cols-[4.5rem_21rem_minmax(0,1fr)]" data-pane="main" aria-busy="true">

  <!-- Domain rail: tiles load with the session -->
  <nav class="ms-rail hidden md:flex flex-col items-center gap-2 pb-3 pt-3 safe-t overflow-y-auto" aria-label="Domains">
    <ul class="flex flex-col gap-2">
      <li><a class="ms-domain-tile" href="#" aria-current="true" title="example.com" aria-label="example.com, current domain">Ex</a></li>
      <li aria-hidden="true"><span class="block size-11 rounded-xl bg-on-rail/15 animate-pulse motion-reduce:animate-none"></span></li>
      <li aria-hidden="true"><span class="block size-11 rounded-xl bg-on-rail/15 animate-pulse motion-reduce:animate-none"></span></li>
    </ul>
  </nav>

  <!-- Sidebar: the domain name is known from the route; the lists are loading -->
  <aside class="ms-sidebar hidden group-data-[pane=list]/app:flex sm:flex flex-col min-h-0 bg-sidebar border-r border-divider" aria-label="Conversations in example.com">
    <header class="flex items-center gap-1 min-h-13 short:min-h-11 safe-t safe-l pl-2 pr-2 border-b border-divider drag-region" style="--ms-edge: 0.5rem">
      <w-btn variant="text" class="no-drag font-bold" append-icon="chevron-down" aria-haspopup="menu" aria-expanded="false">example.com</w-btn>
    </header>
    <div class="px-3 py-2">
      <button type="button" class="flex w-full items-center gap-2 min-h-9 pointer-coarse:min-h-11 rounded-md border border-border bg-surface px-3 text-sm text-subtle opacity-60" disabled><w-icon name="search" class="ms-icon-sm"></w-icon>Search</button>
    </div>
    <div class="flex-1 overflow-hidden px-3 pb-4 grid content-start gap-4" aria-hidden="true">
      <w-skeleton-loader type="list-item@2"></w-skeleton-loader>
      <w-skeleton-loader type="subtitle, list-item@4"></w-skeleton-loader>
      <w-skeleton-loader type="subtitle, list-item-avatar@3"></w-skeleton-loader>
    </div>
    <footer class="border-t border-divider px-3 py-2 safe-b group-data-[pane=list]/app:max-sm:hidden" aria-hidden="true">
      <w-skeleton-loader type="list-item-avatar"></w-skeleton-loader>
    </footer>
  </aside>

  <!-- Main: header and messages are loading -->
  <main class="hidden group-data-[pane=main]/app:flex sm:flex flex-col min-w-0 min-h-0 bg-surface @container/main" aria-labelledby="load-title">
    <header class="flex items-center gap-2 min-h-13 short:min-h-11 safe-t safe-l safe-r border-b border-divider drag-region" style="--ms-edge: 1rem">
      <w-icon-btn class="no-drag sm:hidden -ml-2" icon="arrow-left" href="?pane=list" aria-label="Back to conversations"></w-icon-btn>
      <h1 class="sr-only" id="load-title">Loading example.com</h1>
      <w-skeleton-loader type="heading" class="w-40 @md/main:w-56" aria-hidden="true"></w-skeleton-loader>
    </header>
    <div class="flex-1 min-h-0 overflow-hidden px-4 py-4 @xl/main:px-5 grid content-start gap-5" aria-hidden="true">
      <w-skeleton-loader type="list-item-avatar-three-line" class="max-w-[80ch]"></w-skeleton-loader>
      <w-skeleton-loader type="list-item-avatar-two-line" class="max-w-[60ch]"></w-skeleton-loader>
      <w-skeleton-loader type="list-item-avatar-three-line" class="max-w-[80ch]"></w-skeleton-loader>
      <w-skeleton-loader type="list-item-avatar-two-line" class="max-w-[50ch]"></w-skeleton-loader>
    </div>
    <div class="px-2 pb-3 sm:px-4 safe-b" aria-hidden="true"><w-skeleton-loader type="block" height="5.5rem" class="block overflow-hidden rounded-lg"></w-skeleton-loader></div>
  </main>

  <!-- Bottom navigation: phones, list pane only -->
  <w-bottom-navigation grow class="sm:hidden group-data-[pane=main]/app:hidden group-data-[pane=thread]/app:hidden" value="home" aria-label="Main">
    <w-bottom-nav-item value="home" label="Home" href="?pane=list" active><w-icon name="chat"></w-icon></w-bottom-nav-item>
    <w-bottom-nav-item value="activity" label="Activity" href="activity.html"><w-icon name="bell"></w-icon></w-bottom-nav-item>
    <w-bottom-nav-item value="search" label="Search" href="search.html"><w-icon name="search"></w-icon></w-bottom-nav-item>
    <w-bottom-nav-item value="you" label="You" href="settings.html"><w-icon name="user"></w-icon></w-bottom-nav-item>
  </w-bottom-navigation>

</div>
<p class="sr-only" role="status">Loading example.com</p>

<div class="sr-only" aria-live="polite" id="announcer"></div>
</body>
</html>
